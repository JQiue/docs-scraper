version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
      time: "08:00"
      timezone: Asia/Shanghai

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: "quarterly"
      time: "08:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
