name: Publish image to DockerHub

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # tags: jqiue/docs-scraper:latest,jqiue/docs-scraper:${{ github.ref_name }}
          # tags: |
          #   jqiue/docs-scraper:${{ github.ref_name }}
          #   ${{ !contains(github.ref_name, '-') && 'jqiue/docs-scraper:latest' || '' }}
          tags: |
            jqiue/docs-scraper:${{ github.ref_name }}
            ${{ contains(github.ref_name, '-') && 'jqiue/docs-scraper:next' || 'jqiue/docs-scraper:latest' }}
